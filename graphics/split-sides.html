<style>
:root{
  --bloc-a:#1d6fa5;
  --bloc-b:#e3792b;
  --neither:#8c8c8c;
  --primary:#23517a;
  --secondary:#4ba3cc;
  --text:#1d1d1d;
  --text-light:#707070;
  --background:#ffffff;
  --gridline:#e6e6e6;
  --vote-aye:#4ba3cc;
  --vote-no:#1d1d1d;
  --vote-abstain:#f0b429;
  --font:Roboto,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
:root{--paper:var(--background);--panel:var(--background);--ink:var(--text);--ink-2:color-mix(in srgb,var(--text) 82%,var(--background));--muted:var(--text-light);
--line:var(--gridline);--hair:color-mix(in srgb,var(--gridline) 60%,var(--background));--soft:color-mix(in srgb,var(--gridline) 70%,var(--background));
--a:var(--bloc-a);--a-soft:color-mix(in srgb,var(--bloc-a) 14%,var(--background));--a-ink:color-mix(in srgb,var(--bloc-a) 80%,#000);
--b:var(--bloc-b);--b-soft:color-mix(in srgb,var(--bloc-b) 16%,var(--background));--b-ink:color-mix(in srgb,var(--bloc-b) 70%,#000);
--u:var(--neither);--u-soft:color-mix(in srgb,var(--neither) 14%,var(--background));--u-ink:color-mix(in srgb,var(--neither) 60%,#000);
--split:var(--primary);--contest:var(--secondary);--heat:var(--primary);--heat-on:#fff;--sans:var(--font);--serif:var(--font)}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.fig{max-width:820px;margin:0 auto;padding:12px 10px 10px}
.fig h1{margin:0;font:700 26px/1.2 var(--font);letter-spacing:-.01em}
.fig .sub{margin:6px 0 16px;color:var(--text);font-size:15px;line-height:1.4}
.fig .note{margin:14px 0 0;color:var(--text-light);font-size:12px}
.footer{margin-top:14px;color:var(--text-light);font-size:12px}
.footer a{color:var(--primary);text-decoration:none}.footer a:hover{text-decoration:underline}
.dw-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 12px;font-size:14px}
.dw-legend{color:var(--text)}.dw-legend i{display:inline-block;width:18px;height:18px;margin-right:6px;vertical-align:-4px}
.face{flex:none;display:inline-block;border-radius:50%;vertical-align:middle;background:var(--soft);box-shadow:0 0 0 2px var(--u)}.face.A{box-shadow:0 0 0 2px var(--a)}.face.B{box-shadow:0 0 0 2px var(--b)}
.name.has-face:before{display:none}.name.has-face .face{margin:-3px 7px -3px 2px}
.name{white-space:nowrap}.name:before{content:"";display:inline-block;width:9px;height:9px;margin-right:6px;background:var(--u);vertical-align:0}.name.A:before{background:var(--a)}.name.B:before{background:var(--b)}
.ballot{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 3px;font-size:10px;font-weight:700}
.vY{background:var(--vote-aye);color:#fff}.vN{background:var(--vote-no);color:#fff}.vB{background:var(--vote-abstain);color:var(--text)}.vX{color:var(--muted)}
.chip{padding:2px 7px;font-size:12.5px;font-weight:700;background:var(--u-soft);color:var(--u-ink)}
.chip.A{background:var(--a-soft);color:var(--a-ink)}.chip.B{background:var(--b-soft);color:var(--b-ink)}
.gA{background:var(--a)}.gB{background:var(--b)}.gU{background:var(--u)}
@media(max-width:600px){.fig h1{font-size:21px}.fig .sub{font-size:14px}}

.scroll{overflow-x:auto}
.ss{border-collapse:separate;border-spacing:3px;width:100%;min-width:700px;table-layout:fixed}
.ss th{font-weight:700;font-size:12px}
.ss th.rn{width:122px;text-align:left;font-size:13.5px;padding-right:6px}
.ss thead th.vh{vertical-align:bottom;text-align:center;padding:0 0 4px;font-size:10px;line-height:1.15;color:var(--text);cursor:default}
.ss thead th.vh b{display:block;font-size:12px}
.ss thead th.vh small{display:block;color:var(--text-light);font-weight:400;font-size:10.5px}
.ss tr.lab th{text-align:left;font-size:12px;color:var(--text-light);padding:10px 0 0}
.ss td.c{height:30px;text-align:center;font-size:11px;font-weight:700;color:#fff}
.ss td.c.A{background:var(--a)}.ss td.c.B{background:var(--b)}
.ss td.c.X{background:var(--background);color:var(--text-light);box-shadow:inset 0 0 0 1px var(--gridline)}
.ss td.c.brk{box-shadow:inset 0 0 0 2px var(--text),inset 0 0 0 4px var(--background)}
.ss tr.won th{text-align:left;font-size:12.5px;padding-top:12px}
.ss tr.won td.c{height:22px;font-size:10px}
.ss tr.won td{padding-top:12px}
.wrap{position:relative;min-width:700px}
#colbox{position:absolute;border:1.5px solid var(--text);pointer-events:none;display:none}
.detail{margin:12px 0 0;height:84px;overflow:hidden;font-size:14px;line-height:1.4;padding:10px 12px;background:var(--soft)}
@media(max-width:600px){.detail{height:104px}}
.detail b{font-weight:700}.detail .m{color:var(--text-light)}
.sw-brk{display:inline-block;width:18px;height:18px;margin-right:6px;vertical-align:-4px;background:var(--b);box-shadow:inset 0 0 0 2px var(--text),inset 0 0 0 4px var(--background)}
</style>
</head>

 the City of Berkeley handles and reports requests from federal immigration authorities, vendors, or any non-local agencies to access data for federal immigration enforcement purposes, as well as the recipients of such reports. Additionally, in the event a Federal Agency is given BPD-owned data stored with Flock the Berkeley Police Chief or designee will notify the City Manager, City Attorney, and City Council within 72 hours of the discovery of the _ Incident. d. Add a new section to the Fixed Video Surveillance Policy requiring BPD to observe certain safeguards with respect to surveillance camera data from the Berkeley Police Department’s ALPR policy (Section 1304.12). 3. Additional Safeguards a. The Berkeley City Council reaffirms its intention to approve contracts that are in full compliance with Berkeley City Law, including but not limited to subject BPD policies and the to-be-delivered Sanctuary City Ordinance. As a matter of course, the Berkeley City Council directs the City Manager to ensure that no proposed contractual clauses with Flock for proposed Flock Safety Condor Video Cameras are, or could potentially be, in conflict with Berkeley City Law, prior to final approval of the contract by the Berkeley City Council. For example, Sections 4.3 and 5.3 of Flock boilerplate contractual language appears to contradict city policy. These and other provisions are to be discussed during contract negotiations. b. The City of Berkeley reaffirms the City Manager's authority, which may be delegated to the Berkeley Police Chief, to pause or end the deployment of the subject equipment at any time and for any cause. The City Council shall be, within 48 hours, notified of any such decision to pause or end its deployment. .",0],"901":["2025-10-28","Authorization to Encrypt Berkeley Police Department Primary Radio Channels","Taplin","Humbert","Moved to Action Calendar. 31 speakers. M/S/C (Taplin/Humbert) to adopt Resolution No. 72,001—N.S. as revised in Supplemental Communic <script>
(() => {
const D = DATA, ORDER = D.order, $ = s => document.querySelector(s);
const A = D.info.blocs.A, B = D.info.blocs.B, U = D.info.swing;
const blocOf = n => A.includes(n) ? "A" : B.includes(n) ? "B" : "U";
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (v, d = 0) => v == null ? "–" : `${(v * 100).toFixed(d)}%`;
const fmt = n => n.toLocaleString("en-US");
const list = ns => ns.length < 3 ? ns.join(" and ") : `${ns.slice(0, -1).join(", ")} and ${ns.at(-1)}`;
const face = (n, s = 22) => PHOTOS[n] ? `<img class="face ${blocOf(n)}" src="${PHOTOS[n]}" alt="" width="${s}" height="${s}">` : "";
const nameTag = n => `<span class="name has-face ${blocOf(n)}">${face(n)}${esc(n)}</span>`;
const WORD = {Y: ["Aye", "vY"], N: ["No", "vN"], B: ["Ab", "vB"], a: ["abs", "vX"], r: ["rec", "vX"], ".": ["–", "vX"]};
const FULL = {Y: "Aye", N: "No", B: "Abstain", a: "Absent", r: "Recused", ".": "No vote recorded"};
const ballot = (c, who) => `<span class="ballot ${WORD[c][1]}" title="${esc(who)}: ${FULL[c]}">${WORD[c][0]}</span>`;
const cleanItem = t => String(t || "").replace(/\s*\((Reviewed by|Item contains|ltem contains|Continued from|Item Contains|ltem Contains)[^)]*\)?/gi, "").replace(/^Procedural:\s*/i, "").trim();
const getData = (name, rows) => {
  const cell = v => { const t = String(v ?? ""); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const csv = rows.map(r => r.map(cell).join(",")).join("\n");
  const a = $("#get-data");
  a.href = URL.createObjectURL(new Blob([csv], {type: "text/csv"})); a.download = `${name}.csv`;
};
document.querySelectorAll("[data-range]").forEach(el => el.textContent = `${D.info.date_range[0]} to ${D.info.date_range[1]}`);
const legend = items => { $("#legend").innerHTML = items.map(([style, label]) => `<span>${style ? `<i style="${style}"></i>` : ""}${label}</span>`).join(""); };
const VOTE_LEGEND = [["background:var(--vote-aye)", "Aye"], ["background:var(--vote-no)", "No"], ["background:var(--vote-abstain)", "Abstain"], [null, `<b style="color:var(--text-light);margin-right:6px">abs</b>Absent`], [null, `<b style="color:var(--text-light);margin-right:6px">rec</b>Recused`], [null, `<b style="color:var(--text-light);margin-right:6px">–</b>No vote recorded`]];
if (parent !== window) new ResizeObserver(() => parent.postMessage({graphicHeight: Math.ceil(document.documentElement.getBoundingClientRect().height)}, "*")).observe(document.documentElement);
const motions = () => D.motions.map((r, i) => { const c = (D.context || {})[i]; return {i, title: c ? cleanItem(c[1]) : cleanItem(r[0]), date: c ? c[0] : "", codes: r[2], topic: r[3], level: r[4], passed: !!r[5], a: r[7], b: r[8]}; });

const splits = motions().filter(m => m.level === 2).sort((x, y) => x.date.localeCompare(y.date) || x.i - y.i);
$("#n").textContent = splits.length;
legend([["background:var(--a)", "Took bloc A's side"], ["background:var(--b)", "Took bloc B's side"],
        ["background:var(--background);box-shadow:inset 0 0 0 1px var(--gridline)", "Didn't vote"],
        [null, `<i class="sw-brk"></i>Broke from their own bloc`], [null, `<b style="margin-right:6px">Aye / No / Ab</b>How they voted (Ab = abstained)`]]);
const posA = m => m.a >= 0.5 ? "Y" : "N";
const sideOf = (m, n) => { const c = m.codes[ORDER.indexOf(n)]; if (!"YNB".includes(c)) return null; return ((c === "Y") === (posA(m) === "Y")) ? "A" : "B"; };
const wonBy = m => (posA(m) === "Y") === m.passed ? "A" : "B";
const SHORT = {"Policing & surveillance": "Policing", "Budget, taxes & fees": "Budget", "Procedural & agenda": "Proce\u00addural", "Advocacy & resolutions": "Advo\u00adcacy",
               "Land use & zoning": "Land use", "Streets & transport": "Streets", "Homelessness": "Homeless", "Community grants & culture": "Community"};
const mon = d => d ? new Date(d + "T12:00").toLocaleDateString("en-US", {month: "short", year: "2-digit"}).replace(" ", " ’") : "";
const cols = `<colgroup><col style="width:122px">${splits.map(() => `<col class="vcol">`).join("")}</colgroup>`;
const head = `<thead><tr><th class="rn"></th>${splits.map((m, k) => `<th class="vh" data-k="${k}"><b>${k + 1}</b>${esc(SHORT[m.topic] || m.topic)}<small>${mon(m.date)}</small></th>`).join("")}</tr></thead>`;
const row = n => {
  const sides = splits.map(m => sideOf(m, n)), own = blocOf(n);
  const cells = splits.map((m, k) => { const s = sides[k], c = m.codes[ORDER.indexOf(n)];
    if (!s) return `<td class="c X" data-k="${k}" data-n="${esc(n)}">${c === "a" ? "abs" : c === "r" ? "rec" : "–"}</td>`;
    const brk = own !== "U" && s !== own;
    return `<td class="c ${s}${brk ? " brk" : ""}" data-k="${k}" data-n="${esc(n)}">${{Y: "Aye", N: "No", B: "Ab"}[c]}</td>`; }).join("");
  return `<tr><th class="rn">${nameTag(n)}</th>${cells}</tr>`;
};
const won = `<tr class="won"><th>Side that won</th>${splits.map((m, k) => { const w = wonBy(m); return `<td class="c ${w}" data-k="${k}">${w}</td>`; }).join("")}</tr>`;
$("#ss").innerHTML = cols + head + `<tbody>` + [["Bloc A", A], ["Bloc B", B], ["Neither bloc", U]].map(([l, g]) => `<tr class="lab"><th colspan="${splits.length + 1}">${l}</th></tr>${g.map(row).join("")}`).join("") + won + `</tbody>`;
const box = $("#colbox"), wrap = $(".wrap");
let hk = -1;
const showCol = k => {
  if (k === hk) return; hk = k;
  if (k < 0) { box.style.display = "none"; return; }
  const top = $(`#ss th.vh[data-k="${k}"]`).getBoundingClientRect(), bot = $(`#ss tr.won td[data-k="${k}"]`).getBoundingClientRect(), w = wrap.getBoundingClientRect();
  Object.assign(box.style, {display: "block", left: `${top.left - w.left - 2}px`, top: `${top.top - w.top - 2}px`, width: `${top.width + 4}px`, height: `${bot.bottom - top.top + 4}px`});
  const m = splits[k], won = wonBy(m), ay = [...m.codes].filter(c => c === "Y").length, ag = [...m.codes].filter(c => c === "N" || c === "B").length;
  $("#detail").innerHTML = `<b>${k + 1}. ${esc(m.title)}</b><br><span class="m">${m.date} · ${esc(m.topic)} · ${m.passed ? "Passed" : "Failed"} ${ay}–${ag} · bloc ${won}'s side won</span>`;
};
$("#ss").addEventListener("mouseover", e => { const t = e.target.closest("[data-k]"); if (t) showCol(+t.dataset.k); });
$("#ss").addEventListener("click", e => { const t = e.target.closest("[data-k]"); if (t) showCol(+t.dataset.k); });
addEventListener("resize", () => { const k = hk; hk = -1; showCol(k); });
getData("split-sides", [["member", "usual bloc", ...splits.map((m, k) => `${k + 1}. ${m.date} ${m.title}`)],
  ...ORDER.map(n => [n, blocOf(n) === "U" ? "neither" : blocOf(n), ...splits.map(m => sideOf(m, n) ? `bloc ${sideOf(m, n)} side` : FULL[m.codes[ORDER.indexOf(n)]])]),
  ["Side that won", "", ...splits.map(m => `bloc ${wonBy(m)}`)]]);
})();
</script>
</body>
